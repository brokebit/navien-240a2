# Copy to navien.toml and edit. Every key is optional; these are the defaults.
# Run: venv/bin/python -m navien --config navien.toml

[serial]
port = "/dev/navien"          # udev symlink from packaging/99-navien-dash.rules (or /dev/ttyUSB0)
baud = 19200

[http]
host = "0.0.0.0"
port = 8000
ws_queue = 256                # WebSocket: per-client queue before oldest messages drop
ws_send_timeout_s = 30.0      # WebSocket: drop a client that accepts nothing this long

[state]
history_seconds = 300         # in-memory history window for the dashboard
frame_buffer = 600            # recent raw frames kept for the debug view
bus_timeout_s = 3.0           # no frames for this long -> bus considered down

[rawlog]                      # always on for the live bus; never for --replay
dir = "raw"
rotate = "hourly"             # hourly | daily (UTC)
compress = true               # gzip closed periods
keep_days = 60
max_total_mb = 2048
flush_seconds = 5.0

[influx]                      # InfluxDB 1.x; setup statements in grafana/README.md
enabled = false
url = "http://localhost:8086"
database = "navien"
username = ""                 # leave empty if the server has auth disabled
password = ""
retention_policy = "samples_90d"      # per-cycle samples (navien_unit, navien_cascade)
rollup_retention_policy = "forever"   # counters, bus stats, events, hourly totals
batch_seconds = 10.0
max_queue = 50000             # points held while Influx is unreachable (~4 h of samples)
timeout_s = 10.0
sample_every_s = 1.0          # 1 = every bus cycle

[events]                      # event detection and hourly totals (written with [influx])
debounce_s = 3.0              # a draw/run must last, and a gap in it be shorter, than this
short_burn_s = 30.0           # burns with less flame time than this count as short
hot_band_c = 1.0              # time_to_hot: outlet within this of the setpoint
